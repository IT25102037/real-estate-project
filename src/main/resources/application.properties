spring.application.name=realestate-project

# Load local secrets from .env when running from the project root
#spring.config.import=optional:file:.env[.properties]

# 1. Database Connection
# Ensure "realestatenew_db" exists in MySQL Workbench
spring.datasource.url=jdbc:mysql://localhost:3306/realestatenew_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Navod@2003
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. JPA / Hibernate Configuration
# Fixed: No dot after update
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Explicitly tell Hibernate to use MySQL (Fixes the "Unable to determine Dialect" error)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 3. Server Port
# Ensure your frontend JS uses http://localhost:8080
server.port=8080
