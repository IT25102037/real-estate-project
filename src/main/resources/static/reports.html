<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxeEstate | Reports</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="/js/report-utils.js"></script>
    <style>
        :root { --gold:#c9a96e; --gold-light:#e8d5b0; --obsidian:#0a0a0a; --sidebar-width:280px; --glass-dark:rgba(10,10,10,0.85); --card-glass:rgba(255,255,255,0.04); --glass-border:rgba(255,255,255,0.08); --gold-border:rgba(201,169,110,0.25); --text-main:#f8fafc; --text-dim:#94a3b8; --danger:#ef4444; }
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:linear-gradient(135deg,rgba(10,10,10,.97),rgba(26,20,8,.98)),url('https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=1920&q=80');background-size:cover;background-attachment:fixed;display:flex;height:100vh;color:var(--text-main);font-family:'DM Sans',sans-serif;overflow:hidden}
        aside{width:var(--sidebar-width);background:var(--glass-dark);backdrop-filter:blur(40px);border-right:1px solid var(--gold-border);display:flex;flex-direction:column;padding:40px 20px;flex-shrink:0}
        .sidebar-brand{padding-left:14px;margin-bottom:50px}.sidebar-brand h1{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;letter-spacing:4px;text-transform:uppercase}.sidebar-brand h1 span{color:var(--gold)}.sidebar-brand p{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);opacity:.7;margin-top:4px}
        .nav-item{display:flex;align-items:center;padding:13px 18px;margin-bottom:4px;border-radius:10px;color:rgba(255,255,255,.4);text-decoration:none;font-size:13px;transition:.3s}.nav-item i,.nav-item svg{margin-right:14px;width:16px;height:16px}.nav-item.active{background:rgba(201,169,110,.1);color:var(--gold-light);border:1px solid var(--gold-border)}.nav-item:hover:not(.active){background:rgba(255,255,255,.04);color:rgba(255,255,255,.75)}
        .logout-link{color:rgba(239,68,68,.5)!important;margin-top:auto}
        main{flex:1;padding:48px;overflow-y:auto}
        .page-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:32px}
        .page-header h2{font-family:'Cormorant Garamond',serif;font-size:48px;font-weight:300}.page-header h2 em{color:var(--gold);font-style:italic}
        .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
        .form-input{background:rgba(255,255,255,.05);border:1px solid var(--glass-border);border-radius:8px;color:var(--text-main);padding:10px 14px;font-size:12px;font-family:'DM Sans',sans-serif;outline:none}
        select.form-input{cursor:pointer;color-scheme:dark;appearance:auto}
        select.form-input option,select.form-input optgroup{background:#1a1a1a;color:#f8fafc}
        .form-input:focus{border-color:var(--gold-border)}
        .form-input.invalid{border-color:rgba(239,68,68,.65)}
        .form-error{color:#fca5a5;font-size:10px;margin-top:6px;line-height:1.4;min-height:14px}
        .validation-summary{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:11px;color:#fca5a5;display:none}
        .validation-summary.show{display:block}
        .validation-summary ul{margin:6px 0 0 18px;padding:0}
        .btn-gold,.btn-outline{padding:10px 20px;border-radius:3px;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
        .btn-gold{background:var(--gold);color:var(--obsidian);border:none}.btn-outline{background:transparent;border:1px solid var(--glass-border);color:var(--text-dim)}
        .report-category{margin-bottom:28px;background:var(--card-glass);border:1px solid var(--glass-border);border-radius:20px;overflow:hidden}
        .category-header{padding:20px 24px;border-bottom:1px solid var(--glass-border);display:flex;justify-content:space-between;align-items:center}
        .category-header h3{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400}.category-header h3 em{color:var(--gold);font-style:italic}
        table{width:100%;border-collapse:collapse;font-size:12px}
        th,td{padding:14px 20px;text-align:left;border-bottom:1px solid var(--glass-border)}
        th{color:var(--text-dim);font-size:10px;text-transform:uppercase;letter-spacing:1px}
        .row-actions{display:flex;gap:6px}.row-btn{width:30px;height:30px;border:1px solid var(--glass-border);border-radius:6px;background:transparent;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center}
        .row-btn.danger{color:var(--danger)}.empty-row td{text-align:center;color:var(--text-dim);padding:24px}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100}.modal-overlay.open{display:flex}
        .modal{background:#141414;border:1px solid var(--gold-border);border-radius:16px;padding:32px;width:min(640px,92vw);max-height:90vh;overflow-y:auto;position:relative}
        .modal h2{font-family:'Cormorant Garamond',serif;font-size:28px;margin-bottom:8px}.modal h2 em{color:var(--gold);font-style:italic}
        .form-group{margin-bottom:14px}.form-label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin-bottom:6px}
        .modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
        .modal-close{position:absolute;top:16px;right:16px;background:transparent;border:none;color:var(--text-dim);cursor:pointer}
        .toast{position:fixed;bottom:24px;right:24px;background:#1a1a1a;border:1px solid var(--gold-border);padding:14px 20px;border-radius:10px;display:none;gap:10px;align-items:center;z-index:200}.toast.show{display:flex}
        #viewReportContent{background:rgba(255,255,255,.03);border:1px solid var(--glass-border);border-radius:10px;padding:16px;font-size:12px;max-height:240px;overflow:auto;white-space:pre-wrap}
    </style>
</head>
<body>
<aside>
    <div class="sidebar-brand"><h1>Luxe<span>_Estate</span></h1><p>Admin Console</p></div>
    <nav class="nav-menu" style="flex-grow:1">
        <a href="admin-dashboard.html" class="nav-item"><i data-lucide="layout-grid"></i> Dashboard</a>
        <a href="analytics.html" class="nav-item"><i data-lucide="bar-chart-big"></i> Analytics</a>
        <a href="reports.html" class="nav-item active"><i data-lucide="file-text"></i> Reports</a>
        <a href="view-customer.html" class="nav-item"><i data-lucide="users-2"></i> Customers</a>
        <a href="agents.html" class="nav-item"><i data-lucide="contact-2"></i> Agents</a>
        <a href="analytics.html#transactionsSection" class="nav-item"><i data-lucide="landmark"></i> Transactions</a>
        <a href="view-messages.html" class="nav-item"><i data-lucide="mail"></i> Messages</a>
    </nav>
    <a href="admin-login.html" class="nav-item logout-link"><i data-lucide="power"></i> Logout</a>
</aside>
<main>
    <div class="page-header">
        <div><h2>System <em>Reports</em></h2><p style="font-size:12px;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase;margin-top:8px">All generated reports · Search · Filter · CRUD</p></div>
    </div>
    <div class="toolbar">
        <input class="form-input" id="reportSearch" placeholder="Search reports..." oninput="renderAllReports()" style="min-width:220px">
        <select class="form-input" id="reportTypeFilter" onchange="renderAllReports()">
            <option value="">All types</option>
            <option value="DAILY">Daily</option>
            <option value="WEEKLY">Weekly</option>
            <option value="MONTHLY">Monthly</option>

        </select>
        <select class="form-input" id="reportSort" onchange="renderAllReports()">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="title">Title A–Z</option>
            <option value="type">Type</option>
        </select>
    </div>
    <div id="reportCategories"></div>
</main>

<div class="modal-overlay" id="editModal">
    <div class="modal">
        <button class="modal-close" onclick="closeEditModal()"><i data-lucide="x"></i></button>
        <h2 id="editModalTitle">Edit <em>Report</em></h2>
        <input type="hidden" id="editReportId">
        <div id="editValidationSummary" class="validation-summary" role="alert"></div>
        <div class="form-group"><label class="form-label">Title *</label><input class="form-input" id="editTitle" required aria-describedby="editTitleError"></div>
        <div class="form-group"><label class="form-label">Report Type *</label>
            <select class="form-input" id="editReportType" required onchange="applyEditReportDateRange()" aria-describedby="editReportTypeError">
                <option value="DAILY">Daily</option><option value="WEEKLY">Weekly</option>                <option value="MONTHLY">Monthly</option>

            </select>
        </div>
        <div class="form-group"><label class="form-label">Start Date</label><input class="form-input" id="editStartDate" type="date" aria-describedby="editStartDateError"></div>
        <div class="form-group"><label class="form-label">End Date</label><input class="form-input" id="editEndDate" type="date" aria-describedby="editEndDateError"></div>
        <p id="editDateHint" style="font-size:10px;color:var(--text-dim);margin-top:-8px;margin-bottom:8px;display:none"></p>
        <div class="modal-footer">
            <button class="btn-outline" onclick="closeEditModal()">Cancel</button>
            <button class="btn-gold" onclick="saveEditedReport()">Save Changes</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="viewModal">
    <div class="modal">
        <button class="modal-close" onclick="closeViewModal()"><i data-lucide="x"></i></button>
        <h2 id="viewTitle">Report</h2>
        <p id="viewMeta" style="color:var(--text-dim);font-size:12px;margin-bottom:12px"></p>
        <div id="viewReportContent"></div>
        <div class="modal-footer">
            <button class="btn-outline" onclick="printCurrentView()"><i data-lucide="printer"></i> Print</button>
            <button class="btn-gold" onclick="pdfCurrentView()"><i data-lucide="download"></i> PDF</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="confirmModal">
    <div class="modal" style="max-width:400px;text-align:center">
        <h2>Delete <em>Report</em>?</h2>
        <p style="color:var(--text-dim);margin:16px 0">This cannot be undone.</p>
        <div class="modal-footer" style="justify-content:center">
            <button class="btn-outline" onclick="closeConfirm()">Cancel</button>
            <button class="btn-gold" style="background:var(--danger)" onclick="confirmDelete()">Delete</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"><i data-lucide="check-circle"></i><span id="toastMsg"></span></div>

<script>
    let allReports = [];
    let viewingReport = null;
    let deletingId = null;

    const EDIT_FIELD_MAP = { title: 'editTitle', reportType: 'editReportType', startDate: 'editStartDate', endDate: 'editEndDate' };

    function showToast(msg) {
        document.getElementById('toastMsg').textContent = msg;
        document.getElementById('toast').classList.add('show');
        setTimeout(() => document.getElementById('toast').classList.remove('show'), 3000);
    }

    function clearEditValidation() {
        Object.values(EDIT_FIELD_MAP).forEach(id => {
            const input = document.getElementById(id);
            if (!input) return;
            input.classList.remove('invalid');
            input.removeAttribute('aria-invalid');
            const err = document.getElementById(`${id}Error`);
            if (err) err.remove();
        });
        const summary = document.getElementById('editValidationSummary');
        summary.classList.remove('show');
        summary.innerHTML = '';
    }

    function setEditFieldError(fieldKey, message) {
        const id = EDIT_FIELD_MAP[fieldKey] || fieldKey;
        const input = document.getElementById(id);
        if (!input) return;
        input.classList.add('invalid');
        input.setAttribute('aria-invalid', 'true');
        if (!document.getElementById(`${id}Error`)) {
            const error = document.createElement('div');
            error.className = 'form-error';
            error.id = `${id}Error`;
            input.insertAdjacentElement('afterend', error);
        }
        document.getElementById(`${id}Error`).textContent = message;
    }

    function showEditValidationErrors(fieldErrors) {
        clearEditValidation();
        if (!fieldErrors.length) return;
        const summary = document.getElementById('editValidationSummary');
        summary.innerHTML = '<strong>Please fix the following:</strong><ul>' +
            fieldErrors.map(e => `<li>${escapeHtml(e.message)}</li>`).join('') + '</ul>';
        summary.classList.add('show');
        fieldErrors.forEach(e => setEditFieldError(e.field, e.message));
        const firstId = EDIT_FIELD_MAP[fieldErrors[0].field];
        if (firstId) document.getElementById(firstId)?.focus();
        showToast(fieldErrors[0].message);
    }

    function applyEditReportDateRange() {
        const type = document.getElementById('editReportType').value;
        const range = getReportDateRange(type);
        const hint = document.getElementById('editDateHint');
        if (range) {
            document.getElementById('editStartDate').value = range.startDate;
            document.getElementById('editEndDate').value = range.endDate;
            hint.style.display = 'block';
            hint.textContent = `Date range auto-set for ${formatReportTypeLabel(type)}: ${range.startDate} to ${range.endDate}. You can still adjust if needed.`;
        } else {
            hint.style.display = 'none';
            hint.textContent = '';
        }
    }

    function filteredReports() {
        const q = document.getElementById('reportSearch').value.toLowerCase().trim();
        const type = document.getElementById('reportTypeFilter').value;
        const sort = document.getElementById('reportSort').value;
        let list = [...allReports];
        if (type) list = list.filter(r => (r.reportType || '').toUpperCase() === type);
        if (q) list = list.filter(r =>
            (r.title || '').toLowerCase().includes(q) ||
            (r.propertyName || '').toLowerCase().includes(q) ||
            (r.clientName || '').toLowerCase().includes(q) ||
            (r.agentName || '').toLowerCase().includes(q)
        );
        list.sort((a, b) => {
            if (sort === 'oldest') return new Date(a.createdAt) - new Date(b.createdAt);
            if (sort === 'title') return (a.title || '').localeCompare(b.title || '');
            if (sort === 'type') return (a.reportType || '').localeCompare(b.reportType || '');
            return new Date(b.createdAt) - new Date(a.createdAt);
        });
        return list;
    }

    function renderReportCategorySection(titleFirst, titleEm, items) {
        const rows = items.length ? items.map(r => `
                <tr>
                    <td>${escapeHtml(r.title)}</td>
                    <td>${formatDate(r.createdAt)}</td>
                    <td>${escapeHtml(r.startDate || '—')} – ${escapeHtml(r.endDate || '—')}</td>
                    <td>
                        <div class="row-actions">
                            <button class="row-btn" title="View" onclick="viewReport(${r.id})"><i data-lucide="eye"></i></button>
                            <button class="row-btn" title="Print" onclick="actionPrint(${r.id})"><i data-lucide="printer"></i></button>
                            <button class="row-btn" title="PDF" onclick="actionPdf(${r.id})"><i data-lucide="download"></i></button>
                            <button class="row-btn" title="Edit" onclick="openEdit(${r.id})"><i data-lucide="pencil"></i></button>
                            <button class="row-btn danger" title="Delete" onclick="askDelete(${r.id})"><i data-lucide="trash-2"></i></button>
                        </div>
                    </td>
                </tr>`).join('') : '<tr class="empty-row"><td colspan="4">No reports in this category</td></tr>';
        return `<section class="report-category"><div class="category-header"><h3>${titleFirst} <em>${titleEm}</em></h3><span style="color:var(--text-dim);font-size:12px">${items.length} report(s)</span></div>
                <table><thead><tr><th>Title</th><th>Created</th><th>Date Range</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table></section>`;
    }

    function renderAllReports() {
        const container = document.getElementById('reportCategories');
        const list = filteredReports();
        const knownKeys = new Set(REPORT_CATEGORIES.map(c => c.key));
        let html = REPORT_CATEGORIES.map(cat => {
            const items = list.filter(r => (r.reportType || '').toUpperCase() === cat.key);
            const parts = cat.label.split(' ');
            return renderReportCategorySection(parts[0], parts.slice(1).join(' '), items);
        }).join('');
        const other = list.filter(r => !knownKeys.has((r.reportType || '').toUpperCase()));
        if (other.length) {
            html += renderReportCategorySection('Other', 'Reports', other);
        }
        container.innerHTML = html;
        lucide.createIcons();
    }

    async function loadReports() {
        try {
            allReports = await fetchAllReports();
            renderAllReports();
        } catch (e) {
            showToast(e.message);
        }
    }

    function findReport(id) { return allReports.find(r => r.id === id); }

    function viewReport(id) {
        viewingReport = findReport(id);
        if (!viewingReport) return;
        document.getElementById('viewTitle').textContent = viewingReport.title;
        document.getElementById('viewMeta').textContent = `${formatReportTypeLabel(viewingReport.reportType)} · ${formatDate(viewingReport.createdAt)}`;
        const data = parseReportData(viewingReport);
        document.getElementById('viewReportContent').textContent = data ? JSON.stringify(data, null, 2) : (viewingReport.reportData || 'No detail data.');
        document.getElementById('viewModal').classList.add('open');
        lucide.createIcons();
    }

    function closeViewModal() { document.getElementById('viewModal').classList.remove('open'); viewingReport = null; }
    function printCurrentView() { if (viewingReport) printReport(viewingReport); }
    function pdfCurrentView() { if (viewingReport) downloadReportPdf(viewingReport); }
    function actionPrint(id) { const r = findReport(id); if (r) printReport(r); }
    function actionPdf(id) { const r = findReport(id); if (r) downloadReportPdf(r); }

    function openEdit(id) {
        const r = findReport(id);
        if (!r) return;
        document.getElementById('editReportId').value = r.id;
        document.getElementById('editTitle').value = r.title || '';
        const allowedTypes = ['DAILY', 'WEEKLY', 'MONTHLY', 'AGENT'];
        const type = (r.reportType || 'DAILY').toUpperCase();
        document.getElementById('editReportType').value = allowedTypes.includes(type) ? type : 'DAILY';
        document.getElementById('editStartDate').value = r.startDate || '';
        document.getElementById('editEndDate').value = r.endDate || '';
        clearEditValidation();
        applyEditReportDateRange();
        document.getElementById('editModal').classList.add('open');
    }

    function closeEditModal() {
        document.getElementById('editModal').classList.remove('open');
        clearEditValidation();
    }

    async function saveEditedReport() {
        const id = Number(document.getElementById('editReportId').value);
        const existing = findReport(id);
        const reportType = document.getElementById('editReportType').value;
        if (getReportDateRange(reportType)) {
            applyEditReportDateRange();
        }
        const payload = {
            title: document.getElementById('editTitle').value.trim(),
            reportType,
            startDate: document.getElementById('editStartDate').value || null,
            endDate: document.getElementById('editEndDate').value || null,
            reportData: existing?.reportData || null,
            propertyName: existing?.propertyName,
            clientName: existing?.clientName,
            status: existing?.status,
            value: existing?.value,
            address: existing?.address,
            district: existing?.district,
            agentName: existing?.agentName,
            propertyType: existing?.propertyType
        };
        const { fieldErrors } = validateReportPayloadDetailed(payload, { requireDateRange: true });
        if (fieldErrors.length) {
            showEditValidationErrors(fieldErrors);
            return;
        }
        try {
            await updateReport(id, payload);
            showToast('Report updated successfully.');
            closeEditModal();
            await loadReports();
        } catch (e) {
            showEditValidationErrors([{ field: 'title', message: e.message || 'Could not save the report. Please try again.' }]);
        }
    }

    function askDelete(id) { deletingId = id; document.getElementById('confirmModal').classList.add('open'); }
    function closeConfirm() { deletingId = null; document.getElementById('confirmModal').classList.remove('open'); }
    async function confirmDelete() {
        try {
            await deleteReportById(deletingId);
            showToast('Report deleted.');
            closeConfirm();
            await loadReports();
        } catch (e) { showToast(e.message); }
    }

    window.onload = () => { lucide.createIcons(); loadReports(); };
</script>
</body>
</html>
