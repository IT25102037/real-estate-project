<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Customer - Real Estate</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .form-container {
            background: #1e1e2f;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border-top: 5px solid #bb86fc;
        }

        h2 {
            color: #bb86fc;
            letter-spacing: 1.5px;
            margin-bottom: 30px;
            margin-top: 0;
            font-size: 28px;
        }

        input, textarea, select {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #4a4a6a;
            border-radius: 8px;
            box-sizing: border-box;
            background-color: #2a2a40;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            transition: 0.3s;
        }

        input::placeholder, textarea::placeholder { color: #888; }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #bb86fc;
            box-shadow: 0 0 12px rgba(187, 134, 252, 0.4);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #03dac6;
            color: #121212;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        button:hover {
            background-color: #00e6d2;
            box-shadow: 0 0 15px #03dac6;
            transform: translateY(-2px);
        }

        .nav-link {
            display: inline-block;
            margin-top: 25px;
            color: #bb86fc;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: 0.3s ease;
        }
        .nav-link:hover {
            color: #ffffff;
            text-shadow: 0 0 10px #bb86fc;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>📝 Register Customer</h2>

    <form id="customerForm">
        <input type="text" id="name" placeholder="Full Name" required>
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="text" id="phone" placeholder="Phone Number" required>

        <textarea id="address" placeholder="Home Address" required></textarea>

        <select id="propertyType" required>
            <option value="" disabled selected>Select Property Type</option>
            <option value="House">House</option>
            <option value="Apartment">Apartment</option>
            <option value="Land">Land</option>
            <option value="Commercial">Commercial</option>
        </select>

        <button type="submit">Save Customer</button>
    </form>

    <a href="admin-login.html" class="nav-link">View Registered Customers (Admin)</a>
</div>

<script src="js/customer.js"></script>

</body>
</html>
