<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LuxeEstate</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #818cf8, #d946ef);
            --accent: #22d3ee;
            --glass-dark: rgba(15, 23, 42, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --error-red: #ff4b2b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.8)),
                        url('https://images.pexels.com/photos/1571460/pexels-photo-1571460.jpeg?auto=compress&cs=tinysrgb&w=1600');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-container {
            background: var(--glass-dark);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 35px 40px;
            border-radius: 28px;
            border: 1px solid var(--glass-border);
            width: 100%;
            max-width: 450px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: slideUp 0.6s ease-out;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: -0.5px;
            margin-bottom: 5px;
            display: block;
        }

        h2 {
            color: var(--text-main);
            font-weight: 700;
            margin-bottom: 25px;
            font-size: 30px;
            letter-spacing: -1px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 20px;
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        textarea {
            resize: none;
            height: 80px;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.1);
        }

        select option {
            background: #0f172a;
            color: white;
        }

        button {
            width: 100%;
            padding: 15px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            transition: all 0.4s ease;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 0 10px 20px rgba(217, 70, 239, 0.3);
        }

        /* Password Error Style */
        .error-message {
            color: var(--error-red);
            font-size: 11px;
            margin-top: 4px;
            display: none;
            text-align: left;
            padding-left: 10px;
        }

        .footer-links {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .home-btn {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            opacity: 0.8;
        }

        .nav-link {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 12px;
        }

        .nav-link:hover, .home-btn:hover {
            color: var(--accent);
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="form-container">
    <span class="logo-text">LuxeEstate</span>
    <h2>Register</h2>

    <form id="customerForm">
        <div class="input-group">
            <input type="text" id="name" placeholder="Full Name" required>
        </div>
        <div class="input-group">
            <input type="email" id="email" placeholder="Email Address" required>
        </div>
        <div class="input-group">
            <input type="text" id="phone" placeholder="Phone Number" required>
        </div>
        <div class="input-group">
            <textarea id="address" placeholder="Home Address" required></textarea>
        </div>
        <div class="input-group">
            <select id="propertyType" required>
                <option value="" disabled selected>Preferred Property Type</option>
                <option value="House">House</option>
                <option value="Apartment">Apartment</option>
                <option value="Land">Land</option>
                <option value="Commercial">Commercial</option>
                <option value="Industrial Building">Industrial Building</option>
            </select>
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="Create Password" required>
            <div id="passwordError" class="error-message">Password must be at least 8 characters, with 1 uppercase and 1 number.</div>
        </div>

        <button type="submit">Save Profile</button>
    </form>

    <div class="footer-links">
        <a href="index.html" class="home-btn">← Return to Main Page</a>
        <a href="admin-login.html" class="nav-link">Staff Login (Admin)</a>
    </div>
</div>

<script>
    document.getElementById('customerForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const password = document.getElementById('password').value;
        const passwordError = document.getElementById('passwordError');

        // Strong Password Validation (8 chars, 1 letter, 1 number)
        const strongPasswordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;

        if (!strongPasswordRegex.test(password)) {
            passwordError.style.display = 'block';
            document.getElementById('password').style.borderColor = 'var(--error-red)';
            return; // Stop the form submission
        } else {
            passwordError.style.display = 'none';
            document.getElementById('password').style.borderColor = 'var(--glass-border)';
        }

        const customerData = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            address: document.getElementById('address').value,
            propertyType: document.getElementById('propertyType').value,
            password: document.getElementById("password").value
        };

        fetch('http://localhost:8080/api/customers/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(customerData)
        })
        .then(response => {
            if (!response.ok) {
                return response.text().then(text => { throw new Error(text || 'Registration failed') });
            }
            return response.json();
        })
        .then(data => {
            localStorage.setItem('luxeUser', data.name);
            alert("Welcome to LuxeEstate, " + data.name + "!");
            window.location.href = "index.html";
        })
        .catch(error => {
            console.error('Detailed Error:', error);
            alert("Registration failed. Make sure your Spring Boot server is running!");
        });
    });
</script>

</body>
</html>
