<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LuxeEstate</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(45deg, #a855f7, #06b6d4, #a855f7);
            --vibrant-purple: #a855f7;
            --vibrant-cyan: #06b6d4;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.7)),
                        url('https://images.pexels.com/photos/1571460/pexels-photo-1571460.jpeg?auto=compress&cs=tinysrgb&w=1600');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 50px;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .logo-text {
            font-size: 32px;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            display: block;
        }

        h2 {
            color: #ffffff;
            font-weight: 500;
            margin-bottom: 30px;
            font-size: 24px;
        }

        input, textarea, select {
            width: 100%;
            padding: 14px 20px;
            margin-bottom: 20px;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input::placeholder, textarea::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--vibrant-cyan);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
        }

        select option {
            background: #1e1e2f;
            color: white;
        }

        button {
            width: 100%;
            padding: 16px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(168, 85, 247, 0.3);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(168, 85, 247, 0.5);
        }

        .footer-links {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .nav-link:hover {
            color: var(--vibrant-cyan);
        }

        .home-btn {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            margin-top: 15px;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="form-container">
    <span class="logo-text">LuxeEstate</span>
    <h2>Register</h2>

    <form id="customerForm">
        <input type="text" id="name" placeholder="Full Name" required>
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="text" id="phone" placeholder="Phone Number" required>

        <textarea id="address" placeholder="Home Address" required></textarea>

        <select id="propertyType" required>
            <option value="" disabled selected>Preferred Property Type</option>
            <option value="House">House</option>
            <option value="Apartment">Apartment</option>
            <option value="Land">Land</option>
            <option value="Commercial">Commercial</option>
        </select>

        <button type="submit">Save Profile</button>
    </form>

    <div class="footer-links">
        <a href="index.html" class="home-btn">← Back to Main Gallery</a>
        <a href="admin-login.html" class="nav-link">Staff Login (Admin)</a>
    </div>
</div>

<script>
    document.getElementById('customerForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const customerData = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            address: document.getElementById('address').value,
            propertyType: document.getElementById('propertyType').value
        };

        // FIXED URL: Removed '/save-customer' because the Controller handles POST at root '/api/customers'
        fetch('http://localhost:8080/api/customers', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(customerData)
        })
        .then(response => {
            if (!response.ok) {
                return response.text().then(text => { throw new Error(text || 'Registration failed') });
            }
            return response.json();
        })
        .then(data => {
            localStorage.setItem('luxeUser', data.name);
            alert("Welcome to LuxeEstate, " + data.name + "!");
            window.location.href = "index.html";
        })
        .catch(error => {
            console.error('Detailed Error:', error);
            alert("Registration failed. Make sure your Spring Boot server is running!");
        });
    });
</script>

</body>
</html>
