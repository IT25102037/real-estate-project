<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Real Estate</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* PERFECTLY CENTERED DARK MODE BODY */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #121212; /* Matches the dashboard */
            color: #e0e0e0;
            margin: 0;
            height: 100vh; /* Takes up exactly 100% of the screen height */
            display: flex;
            align-items: center; /* Centers vertically */
            justify-content: center; /* Centers horizontally */
        }

        /* PREMIUM LOGIN CARD */
        .login-container {
            background: #1e1e2f; /* Elevated dark card */
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border-top: 5px solid #bb86fc; /* Matching neon purple line */
        }

        h2 {
            color: #bb86fc;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            margin-top: 0;
            font-size: 26px;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* ERROR MESSAGE STYLING */
        .error-msg {
            color: #ff1744; /* Bright neon red so it stands out */
            font-size: 14px;
            display: none;
            background: rgba(255, 23, 68, 0.1);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ff1744;
            margin-bottom: 20px;
        }

        /* LARGE, COMFORTABLE INPUT FIELDS */
        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #4a4a6a;
            border-radius: 8px;
            box-sizing: border-box;
            background-color: #2a2a40;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            transition: 0.3s;
        }
        input::placeholder { color: #888; }
        input:focus {
            outline: none;
            border-color: #bb86fc;
            box-shadow: 0 0 12px rgba(187, 134, 252, 0.4);
        }

        /* GLOWING ACTION BUTTON */
        button {
            width: 100%;
            padding: 15px;
            background-color: #6200ea; /* Deep purple */
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            margin-bottom: 25px;
        }
        button:hover {
            background-color: #7c4dff;
            box-shadow: 0 0 15px #6200ea; /* Purple glow */
            transform: translateY(-2px);
        }

        /* MATCHING LINK */
        .nav-link {
            display: inline-block;
            color: #bb86fc;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: 0.3s ease;
        }
        .nav-link:hover {
            color: #ffffff;
            text-shadow: 0 0 10px #bb86fc;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>🔐 Admin Access</h2>
    <p class="subtitle">Enter your credentials to manage leads.</p>

    <p class="error-msg" id="errorMessage">⚠️ Invalid username or password.</p>

    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>

    <button onclick="checkLogin()">Secure Login</button>

    <a href="add-customer.html" class="nav-link">← Back to Registration</a>
</div>

<script>
    function checkLogin() {
        const user = document.getElementById("username").value;
        const pass = document.getElementById("password").value;

        // Check against our default username and password
        if (user === "admin" && pass === "admin123") {
            // Success! Send them to the admin dashboard
            window.location.href = "view-customer.html";
        } else {
            // Fail! Show the beautiful neon error message
            document.getElementById("errorMessage").style.display = "block";
        }
    }
</script>

</body>
</html>
