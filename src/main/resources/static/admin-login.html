<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access | LuxeEstate</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
            --vibrant-purple: #a855f7;
            --vibrant-cyan: #06b6d4;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.4), rgba(6, 182, 212, 0.4)),
                        url('https://images.pexels.com/photos/37347/office-sitting-room-executive-sitting.jpg?auto=compress&cs=tinysrgb&w=1600');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Decorative Background Glows */
        .glow-orb {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.5;
        }
        .orb-top { background: var(--vibrant-purple); top: -20%; left: -10%; }
        .orb-bottom { background: var(--vibrant-cyan); bottom: -20%; right: -10%; }

        .login-container {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 50px 40px;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            width: 90%;
            max-width: 400px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: slideUp 0.8s ease-out;
            position: relative;
            z-index: 10;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-text {
            font-size: 32px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            display: block;
        }

        h1 {
            color: #ffffff;
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(to right, #ffffff, var(--vibrant-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(6, 182, 212, 0.2);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 35px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ERROR MESSAGE */
        .error-msg {
            color: #ff4d4d;
            font-size: 14px;
            display: none;
            background: rgba(255, 77, 77, 0.15);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 77, 77, 0.3);
            margin-bottom: 25px;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        input {
            width: 100%;
            padding: 16px 20px;
            margin-bottom: 20px;
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--vibrant-cyan);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
            transform: translateY(-2px);
        }

        button {
            width: 100%;
            padding: 18px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.4s;
            box-shadow: 0 15px 30px rgba(168, 85, 247, 0.4);
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 20px 40px rgba(6, 182, 212, 0.5);
            filter: brightness(1.1);
        }

        .footer-nav {
            margin-top: 30px;
            border-top: 1px solid var(--glass-border);
            padding-top: 20px;
        }

        .nav-link {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: 0.3s;
            opacity: 0.8;
        }

        .nav-link:hover {
            opacity: 1;
            color: var(--vibrant-cyan);
            text-shadow: 0 0 10px var(--vibrant-cyan);
        }
    </style>
</head>
<body>

<div class="glow-orb orb-top"></div>
<div class="glow-orb orb-bottom"></div>

<div class="login-container">
    <span class="logo-text">LuxeEstate</span>
    <h1>Admin Login</h1>
    <p class="subtitle">Secure Staff Access</p>

    <p class="error-msg" id="errorMessage">⚠️ Unauthorized Credentials</p>

    <input type="text" id="username" placeholder="Admin Username" required>
    <input type="password" id="password" placeholder="Password" required>

    <button onclick="checkLogin()">Authorize Entry</button>

    <div class="footer-nav">
        <a href="add-customer.html" class="nav-link">← Return to Registration</a>
    </div>
</div>

<script>
    function checkLogin() {
        const user = document.getElementById("username").value;
        const pass = document.getElementById("password").value;
        const error = document.getElementById("errorMessage");

        // Updated redirect logic to point to admin-dashboard.html
        if (user === "admin" && pass === "admin123") {
            window.location.href = "admin-dashboard.html";
        } else {
            error.style.display = "block";
            // Trigger reflow for shake animation
            error.style.animation = 'none';
            error.offsetHeight;
            error.style.animation = null;
        }
    }
</script>

</body>
</html>
