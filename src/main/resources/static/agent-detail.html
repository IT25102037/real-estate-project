<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Contact | LuxeEstate</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background: #f8fafc;
        }

        /* Banner matching agent's expertise */
        .banner {
            height: 300px;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
                        url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }

        .form-card {
            max-width: 500px;
            margin: -80px auto 50px;
            background: white;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.1);
            position: relative;
        }

        .agent-mini-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .agent-mini-profile img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
        }

        .agent-mini-profile h4 { margin: 0; color: #1e293b; }
        .agent-mini-profile p { margin: 0; font-size: 0.85rem; color: #64748b; }

        h2 { font-weight: 700; color: #1e293b; margin-bottom: 10px; }

        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 13px; font-weight: 600; color: #64748b; margin-bottom: 8px; }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: #a855f7; }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .back-nav {
            display: block;
            text-align: center;
            margin-top: 25px;
            text-decoration: none;
            color: #64748b;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="banner">
    <div>
        <h1 style="font-size: 2.5rem; margin-bottom: 0;">Agent Profile</h1>
        <p>Expert guidance through your property finance journey.</p>
    </div>
</div>

<div class="form-card">
    <h2>Get in touch</h2>
    <p style="color: #64748b; font-size: 0.95rem; margin-bottom: 25px;">
        James can guide you, every step of the way, throughout your property finance journey.
    </p>

    <div class="agent-mini-profile">
        <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&w=400" alt="Agent">
        <div>
            <h4>James Wilson</h4>
            <p>Senior Luxury Specialist</p>
        </div>
    </div>

    <form>
        <div class="form-group">
            <label>First name</label>
            <input type="text" placeholder="Your name">
        </div>
        <div class="form-group">
            <label>Contact number</label>
            <input type="tel" placeholder="Your phone">
        </div>
        <div class="form-group">
            <label>Email address</label>
            <input type="email" placeholder="Your email">
        </div>
        <button type="submit" class="submit-btn">Send</button>
    </form>

    <a href="agents.html" class="back-nav">← Back to all agents</a>
</div>

</body>
</html>
