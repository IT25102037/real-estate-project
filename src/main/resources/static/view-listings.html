<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Listings | LuxeEstate Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
            --vibrant-purple: #a855f7;
            --vibrant-cyan: #06b6d4;
            --text-dark: #1e293b;
            --bg-light-blue: #f0f9ff;
            --table-border: #e2e8f0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-light-blue);
            margin: 0;
            padding: 40px 20px;
            color: var(--text-dark);
        }

        .dashboard-container {
            max-width: 1400px;
            margin: auto;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo-section h1 {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            font-size: 32px;
            font-weight: 800;
        }

        .back-link {
            text-decoration: none;
            color: var(--vibrant-purple);
            font-weight: 600;
        }

        .filter-panel {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-panel input, .filter-panel select {
            padding: 12px 15px;
            border: 1px solid var(--table-border);
            border-radius: 10px;
            font-family: 'Poppins';
            outline: none;
            font-size: 14px;
        }

        .input-id { width: 100px; }
        .input-general { flex: 2; min-width: 250px; }
        .select-type { flex: 1; min-width: 150px; }
        .input-price { flex: 1; min-width: 150px; }

        .btn-filter {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .btn-filter:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-reset {
            background: #f1f5f9;
            color: #64748b;
            border: 1px solid #e2e8f0;
            padding: 12px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .table-container {
            background: white;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid var(--table-border);
        }

        th {
            padding: 18px;
            color: var(--vibrant-purple);
            text-transform: uppercase;
            font-size: 13px;
            border: 1px solid var(--table-border);
            background-color: #fafafa;
            text-align: center;
        }

        td {
            padding: 15px;
            border: 1px solid var(--table-border);
            font-size: 14px;
            text-align: center;
        }

        /* --- NEW: OOPS MESSAGE STYLING --- */
        #noResultsRow {
            display: none;
        }

        .no-results-content {
            padding: 50px 0;
            text-align: center;
        }

        .no-results-content h2 {
            color: #ef4444;
            margin-bottom: 5px;
        }

        .no-results-content p {
            color: #64748b;
            font-size: 16px;
        }

        .prop-img {
            width: 65px;
            height: 48px;
            object-fit: cover;
            border-radius: 8px;
        }

        .price-tag { color: var(--vibrant-cyan); font-weight: 700; }

        .btn-remove {
            padding: 8px 16px;
            border: 1px solid #e2e8f0;
            background: white;
            color: #64748b;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-remove:hover {
            background: #fef2f2;
            color: #ef4444;
            border-color: #fca5a5;
        }

        .type-badge {
            background: #f0f9ff;
            color: #0369a1;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="header-flex">
        <div class="logo-section">
            <h1>LuxeEstate</h1>
            <p style="margin:0; color:#64748b; font-weight:500;">Property Inventory Dashboard</p>
        </div>
        <a href="admin-dashboard.html" class="back-link">← Back to Dashboard</a>
    </div>

    <div class="filter-panel">
        <input type="text" id="searchId" class="input-id" placeholder="ID (#1)">
        <input type="text" id="searchGeneral" class="input-general" placeholder="Search Title, Seller or Location...">
        <select id="filterType" class="select-type">
            <option value="">All Types</option>
            <option value="Mansion">Mansion</option>
            <option value="Penthouse">Penthouse</option>
            <option value="House">House</option>
            <option value="Land">Land</option>
            <option value="Industrial">Industrial Building</option>
            <option value="Apartment">Apartment</option>
        </select>
        <input type="number" id="searchPrice" class="input-price" placeholder="Max Price (LKR)">
        <button class="btn-filter" onclick="applyFilters()">
            <span>🔍</span> Filter
        </button>
        <button class="btn-reset" onclick="resetFilters()">Reset</button>
    </div>

    <div class="table-container">
        <table id="listingsTable">
            <thead>
            <tr>
                <th>ID</th>
                <th>Preview</th>
                <th>Title</th>
                <th>Seller</th>
                <th>Type</th>
                <th>Price (LKR)</th>
                <th>Location</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="listingsTableBody"></tbody>
            <tr id="noResultsRow">
                <td colspan="8">
                    <div class="no-results-content">
                        <h2>Oops! 🧐</h2>
                        <p>Your result is not in there. Try adjusting your filters.</p>
                    </div>
                </td>
            </tr>
        </table>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", fetchListings);

    async function fetchListings() {
        try {
            const response = await fetch('http://localhost:8081/api/listings/all');
            const listings = await response.json();
            renderTable(listings);
        } catch (error) {
            console.error("Failed to load listings:", error);
        }
    }

    function renderTable(listings) {
        const tableBody = document.getElementById('listingsTableBody');
        tableBody.innerHTML = "";

        listings.forEach(item => {
            const row = `
                <tr>
                    <td>#${item.id}</td>
                    <td><img src="${item.imagePath}" class="prop-img" onerror="this.src='https://via.placeholder.com/60x45?text=No+Img'"></td>
                    <td style="font-weight: 600; text-align: left;">${item.propertyTitle}</td>
                    <td>${item.ownerName}</td>
                    <td><span class="type-badge">${item.propertyType}</span></td>
                    <td class="price-tag" data-price="${item.price}">Rs. ${item.price.toLocaleString()}</td>
                    <td style="text-align: left;">📍 ${item.location}</td>
                    <td><button class="btn-remove" onclick="deleteListing(${item.id})">Remove</button></td>
                </tr>`;
            tableBody.innerHTML += row;
        });
    }

    function applyFilters() {
        const idFilter = document.getElementById("searchId").value.toUpperCase();
        const generalFilter = document.getElementById("searchGeneral").value.toUpperCase();
        const typeFilter = document.getElementById("filterType").value.toUpperCase();
        const priceFilter = parseFloat(document.getElementById("searchPrice").value);

        const tableBody = document.getElementById("listingsTableBody");
        const tr = tableBody.getElementsByTagName("tr");
        const noResults = document.getElementById("noResultsRow");

        let visibleCount = 0;

        for (let i = 0; i < tr.length; i++) {
            const tdId = tr[i].getElementsByTagName("td")[0].textContent.toUpperCase();
            const tdTitle = tr[i].getElementsByTagName("td")[2].textContent.toUpperCase();
            const tdSeller = tr[i].getElementsByTagName("td")[3].textContent.toUpperCase();
            const tdType = tr[i].getElementsByTagName("td")[4].textContent.toUpperCase();
            const tdPriceRaw = tr[i].getElementsByTagName("td")[5].getAttribute("data-price");
            const tdLocation = tr[i].getElementsByTagName("td")[6].textContent.toUpperCase();

            const tdPrice = parseFloat(tdPriceRaw);

            const matchesId = tdId.indexOf(idFilter) > -1;
            const matchesGeneral = tdTitle.indexOf(generalFilter) > -1 || tdSeller.indexOf(generalFilter) > -1 || tdLocation.indexOf(generalFilter) > -1;
            const matchesType = typeFilter === "" || tdType.indexOf(typeFilter) > -1;
            const matchesPrice = isNaN(priceFilter) || tdPrice <= priceFilter;

            if (matchesId && matchesGeneral && matchesType && matchesPrice) {
                tr[i].style.display = "";
                visibleCount++;
            } else {
                tr[i].style.display = "none";
            }
        }

        // --- NEW: TOGGLE THE OOPS MESSAGE ---
        if (visibleCount === 0) {
            noResults.style.display = "table-row";
        } else {
            noResults.style.display = "none";
        }
    }

    function resetFilters() {
        document.getElementById("searchId").value = "";
        document.getElementById("searchGeneral").value = "";
        document.getElementById("filterType").value = "";
        document.getElementById("searchPrice").value = "";
        applyFilters();
    }

    async function deleteListing(id) {
        if (!confirm("Are you sure?")) return;
        try {
            const response = await fetch(`http://localhost:8081/api/listings/delete/${id}`, { method: 'DELETE' });
            if (response.ok) { alert("Listing removed."); fetchListings(); }
        } catch (error) { alert("Error connecting to server."); }
    }
</script>

</body>
</html>
