<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Customers | LuxeEstate Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
            --vibrant-purple: #a855f7;
            --vibrant-cyan: #06b6d4;
            --text-dark: #1e293b;
            --bg-light-blue: #f0f9ff;
            --table-border: #e2e8f0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-light-blue);
            margin: 0;
            padding: 40px 20px;
            color: var(--text-dark);
        }

        .dashboard-container {
            max-width: 1400px;
            margin: auto;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo-section h1 {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            font-size: 32px;
            font-weight: 800;
        }

        .back-link {
            text-decoration: none;
            color: var(--vibrant-purple);
            font-weight: 600;
        }

        /* --- CLEAN FILTER BAR --- */
        .filter-panel {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-panel input, .filter-panel select {
            padding: 12px 15px;
            border: 1px solid var(--table-border);
            border-radius: 10px;
            font-family: 'Poppins';
            outline: none;
            font-size: 14px;
        }

        .input-id { width: 100px; }
        .input-general { flex: 2; min-width: 250px; }
        .select-type { flex: 1; min-width: 150px; }

        .btn-filter {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .btn-reset {
            background: #f1f5f9;
            color: #64748b;
            border: 1px solid #e2e8f0;
            padding: 12px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        /* --- TABLE STYLING --- */
        .table-container {
            background: white;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid var(--table-border);
        }

        th {
            padding: 18px;
            color: var(--vibrant-purple);
            text-transform: uppercase;
            font-size: 13px;
            border: 1px solid var(--table-border);
            background-color: #fafafa;
            text-align: center;
        }

        td {
            padding: 15px;
            border: 1px solid var(--table-border);
            font-size: 14px;
            text-align: center;
        }

        .property-badge {
            background: #f0f9ff;
            color: #0369a1;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .btn-delete {
            padding: 8px 16px;
            border: 1px solid #e2e8f0;
            background: white;
            color: #64748b;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-delete:hover {
            background: #fef2f2;
            color: #ef4444;
            border-color: #fca5a5;
        }

        /* Oops Message */
        #noResultsRow { display: none; }
        .no-results-content { padding: 50px 0; text-align: center; }
        .no-results-content h2 { color: #ef4444; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="header-flex">
        <div class="logo-section">
            <h1>LuxeEstate</h1>
            <p style="margin:0; color:#64748b; font-weight:500;">Staff Lead Dashboard</p>
        </div>
        <a href="admin-dashboard.html" class="back-link">← Back to Dashboard</a>
    </div>

    <div class="filter-panel">
        <input type="text" id="searchId" class="input-id" placeholder="ID (#)">
        <input type="text" id="searchGeneral" class="input-general" placeholder="Search by name, email or location...">
        <select id="propertyFilter" class="select-type">
            <option value="">All Interests</option>
            <option value="House">House</option>
            <option value="Apartment">Apartment</option>
            <option value="Land">Land</option>
            <option value="Commercial">Commercial</option>
        </select>
        <button class="btn-filter" onclick="filterCustomers()">🔍 Filter</button>
        <button class="btn-reset" onclick="resetFilters()">Reset</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Contact Details</th>
                <th>Interest</th>
                <th>Location</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="customerTableBody"></tbody>
            <tr id="noResultsRow">
                <td colspan="6">
                    <div class="no-results-content">
                        <h2>Oops! 🧐</h2>
                        <p>Your result is not in there.</p>
                    </div>
                </td>
            </tr>
        </table>
    </div>
</div>

<script src="js/view-customer.js"></script>
</body>
</html>
