<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Customers</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* DARK MODE STYLES */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 30px;
            margin: 0;
        }

        .table-container {
            background: #1e1e2f;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 1200px;
            margin: auto;
            border-top: 5px solid #bb86fc;
        }

        h2 {
            text-align: center;
            color: #bb86fc;
            letter-spacing: 1.5px;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #bb86fc;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: 0.3s ease;
        }
        .nav-link:hover {
            color: #ffffff;
            text-shadow: 0 0 10px #bb86fc;
        }

        /* Search and Filter Inputs */
        .filter-container { display: flex; gap: 20px; margin-bottom: 30px; }
        .filter-input, .filter-select {
            flex: 1;
            padding: 16px 20px;
            font-size: 16px;
            background-color: #2a2a40;
            border: 1px solid #4a4a6a;
            border-radius: 8px;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            transition: 0.3s;
        }
        .filter-input::placeholder { color: #888; }
        .filter-input:focus, .filter-select:focus {
            outline: none;
            border-color: #bb86fc;
            box-shadow: 0 0 10px rgba(187, 134, 252, 0.4);
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            border: 1px solid #4a4a6a;
        }

        /* THIS IS THE MAGIC LINE: text-align: center; */
        th, td {
            padding: 18px 15px;
            text-align: center; /* This perfectly centers all your text! */
            border: 1px solid #4a4a6a;
            vertical-align: middle;
        }

        th {
            background-color: #2a2a40;
            color: #bb86fc;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 15px;
            letter-spacing: 1px;
        }

        tr:hover { background-color: #2e2e48; }

        /* Beautiful Action Buttons */
        .action-btn {
            padding: 10px 16px;
            margin: 2px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .edit-btn { background-color: #3700b3; }
        .edit-btn:hover {
            background-color: #6200ea;
            box-shadow: 0 0 10px #6200ea;
            transform: translateY(-2px);
        }
        .delete-btn { background-color: #cf6679; color: #121212; }
        .delete-btn:hover {
            background-color: #ff1744;
            color: white;
            box-shadow: 0 0 10px #ff1744;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="table-container">
    <a href="add-customer.html" class="nav-link">← Back to Registration</a>

    <h2>Admin Dashboard - Registered Customers</h2>

    <div class="filter-container">
        <input type="text" id="searchInput" onkeyup="filterCustomers()" class="filter-input" placeholder="🔍 Search by name, email, phone...">

        <select id="propertyFilter" onchange="filterCustomers()" class="filter-select">
            <option value="All">All Property Types</option>
            <option value="House">House</option>
            <option value="Apartment">Apartment</option>
            <option value="Land">Land</option>
            <option value="Commercial">Commercial</option>
        </select>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Property</th>
            <th>Address</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody id="customerTableBody">
        </tbody>

        <tbody id="noResultsMessage" style="display: none;">
        <tr>
            <td colspan="7" style="text-align: center; padding: 60px; color: #888; font-size: 18px; border: none;">
                🕵️‍♂️ <strong>Oops!</strong> No customers found. <br> Time to hunt for some new leads! 🏡
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="js/view-customer.js"></script>

</body>
</html>
