<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Login - LuxeEstate</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,700;0,900;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c9a96e;
            --gold-light: #e8d5b0;
            --gold-dark: #8b6914;
            --obsidian: #0a0a0a;
            --white: #ffffff;
            --border-subtle: rgba(201,169,110,0.2);
            --border-gold: rgba(201,169,110,0.5);
            --error-red: #ef4444;
            --transition-smooth: cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Background */
        .bg-layer {
            position: fixed;
            inset: 0;
            background: url('https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            filter: brightness(0.50) saturate(1.1);
            transform: scale(1.05);
            animation: bgDrift 22s ease-in-out infinite alternate;
            z-index: 0;
        }

        @keyframes bgDrift {
            0%   { transform: scale(1.05) translate(0, 0); }
            100% { transform: scale(1.12) translate(-1.5%, -1%); }
        }

        /* Warm overlay */
        .bg-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(160deg, rgba(20,14,6,0.40) 0%, rgba(10,8,4,0.45) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* Grain */
        .bg-grain {
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            opacity: 0.22;
            z-index: 2;
            pointer-events: none;
        }

        /* Gold glow */
        .bg-glow {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 55% 40%, rgba(201,169,110,0.10) 0%, transparent 60%);
            z-index: 2;
            pointer-events: none;
        }

        /* Vertical gold lines */
        .gold-line-top {
            position: fixed;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 1px; height: 90px;
            background: linear-gradient(to bottom, transparent, var(--gold), transparent);
            z-index: 3;
            opacity: 0.55;
        }
        .gold-line-bottom {
            position: fixed;
            bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 1px; height: 90px;
            background: linear-gradient(to top, transparent, var(--gold), transparent);
            z-index: 3;
            opacity: 0.55;
        }

        /* Page wrapper - Adjusted padding for better vertical centering */
        .page-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 20px 40px;
        }

        .page-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--white);
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeUp 0.8s 0.1s var(--transition-smooth) forwards;
            text-shadow: 0 2px 20px rgba(0,0,0,0.3);
        }
        .page-logo span { color: var(--gold); }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            color: var(--gold);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 14px;
            opacity: 0;
            animation: fadeUp 0.8s 0.25s var(--transition-smooth) forwards;
        }
        .eyebrow::before, .eyebrow::after {
            content: '';
            width: 32px; height: 1px;
            background: var(--gold);
            opacity: 0.6;
        }

        /* Form card - Added negative margin to pull the box higher */
        .form-container {
            background: rgba(45, 35, 20, 0.46);
            backdrop-filter: blur(36px) saturate(1.8) brightness(1.1);
            -webkit-backdrop-filter: blur(36px) saturate(1.8) brightness(1.1);
            border: 1px solid var(--border-gold);
            border-radius: 3px;
            width: 100%;
            max-width: 440px;
            padding: 52px 48px;
            box-shadow:
                0 28px 56px rgba(0,0,0,0.30),
                inset 0 1px 0 rgba(201,169,110,0.18);
            opacity: 0;
            animation: fadeUp 0.9s 0.35s var(--transition-smooth) forwards;
            position: relative;
            overflow: hidden;
            margin-top: -40px;
        }

        /* Corner accents */
        .form-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 40px; height: 40px;
            border-top: 1px solid var(--gold);
            border-left: 1px solid var(--gold);
            opacity: 0.55;
        }
        .form-container::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 40px; height: 40px;
            border-bottom: 1px solid var(--gold);
            border-right: 1px solid var(--gold);
            opacity: 0.55;
        }

        .form-heading {
            font-family: 'Cormorant Garamond', serif;
            font-size: 40px;
            font-weight: 300;
            color: var(--white);
            letter-spacing: -0.5px;
            line-height: 1.1;
            margin-bottom: 8px;
        }
        .form-heading em { font-style: italic; color: var(--gold); }

        .form-subheading {
            color: rgba(255,255,255,0.48);
            font-size: 12px;
            letter-spacing: 0.5px;
            font-weight: 300;
            margin-bottom: 32px;
        }

        .gold-divider {
            width: 48px; height: 1px;
            background: var(--gold);
            opacity: 0.5;
            margin-bottom: 28px;
        }

        /* Error message banner */
        #errorMessage {
            display: none;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            border-radius: 2px;
            color: #fca5a5;
            font-size: 11px;
            letter-spacing: 0.4px;
            padding: 11px 14px;
            margin-bottom: 20px;
            text-align: left;
            animation: shakeX 0.4s var(--transition-smooth);
        }

        @keyframes shakeX {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-6px); }
            40%       { transform: translateX(6px); }
            60%       { transform: translateX(-4px); }
            80%       { transform: translateX(4px); }
        }

        .input-group {
            margin-bottom: 16px;
            position: relative;
        }

        .input-label {
            display: block;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold);
            opacity: 0.85;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px 18px;
            background: rgba(255,255,255,0.09);
            border: 1px solid rgba(201,169,110,0.22);
            border-radius: 2px;
            color: var(--white);
            font-size: 13px;
            font-family: 'DM Sans', sans-serif;
            font-weight: 400;
            letter-spacing: 0.3px;
            transition: all 0.35s var(--transition-smooth);
            outline: none;
        }

        input::placeholder {
            color: rgba(255,255,255,0.30);
        }

        input:focus {
            background: rgba(201,169,110,0.09);
            border-color: var(--border-gold);
            box-shadow: 0 0 0 3px rgba(201,169,110,0.09);
        }

        /* Submit button */
        button[type="submit"] {
            width: 100%;
            padding: 17px;
            background: var(--gold);
            color: var(--obsidian);
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
            font-family: 'DM Sans', sans-serif;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 8px;
            transition: all 0.4s var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }
        button[type="submit"]::before {
            content: '';
            position: absolute; inset: 0;
            background: var(--gold-light);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s var(--transition-smooth);
        }
        button[type="submit"]:hover { box-shadow: 0 0 40px rgba(201,169,110,0.35); }
        button[type="submit"]:hover::before { transform: scaleX(1); }
        button[type="submit"] span { position: relative; z-index: 1; }
        button[type="submit"]:disabled {
            background: rgba(201,169,110,0.35);
            color: rgba(10,10,10,0.55);
            cursor: not-allowed;
            box-shadow: none;
        }
        button[type="submit"]:disabled::before { display: none; }

        /* Footer links */
        .footer-links {
            margin-top: 26px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding-top: 22px;
            border-top: 1px solid var(--border-subtle);
        }

        .register-link {
            color: rgba(255,255,255,0.55);
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s;
        }
        .register-link::after { content: '→'; color: var(--gold); }
        .register-link:hover { color: var(--white); }

        .page-footer {
            margin-top: 32px;
            color: rgba(255,255,255,0.28);
            font-size: 10px;
            letter-spacing: 1px;
            text-align: center;
            opacity: 0;
            animation: fadeUp 0.8s 0.7s var(--transition-smooth) forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(22px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #1a130a; }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 2px; }
    </style>
</head>
<body>

<div class="bg-layer"></div>
<div class="bg-overlay"></div>
<div class="bg-grain"></div>
<div class="bg-glow"></div>
<div class="gold-line-top"></div>
<div class="gold-line-bottom"></div>

<div class="page-wrapper">

    <div class="page-logo">Luxe<span>_Estate</span></div>
    <div class="eyebrow">Member Access</div>

    <div class="form-container">

        <h2 class="form-heading">Welcome<br><em>Back</em></h2>
        <p class="form-subheading">Sign in to your private estate portal</p>
        <div class="gold-divider"></div>

        <div id="errorMessage">Invalid email or password. Please try again.</div>

        <form id="loginForm">
            <div class="input-group">
                <label class="input-label">Email Address</label>
                <input id="email" placeholder="your@email.com" required type="email">
            </div>
            <div class="input-group">
                <label class="input-label">Password</label>
                <input id="password" placeholder="Enter your password" required type="password">
            </div>
            <button id="loginBtn" type="submit"><span>Sign In</span></button>
        </form>

        <div class="footer-links">
            <a href="add-customer.html" class="register-link">Don't have an account? Register</a>
        </div>

    </div>

    <p class="page-footer">© 2026 LuxeEstate Properties. All Rights Reserved.</p>

</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginBtn');

        // Reset UI
        errorDiv.style.display = 'none';
        loginBtn.disabled = true;
        loginBtn.querySelector('span').innerText = "Checking...";

        const loginData = {
            email: email,
            password: password
        };

        // Call your Spring Boot API
        fetch('http://localhost:8080/api/customers/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(loginData)
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Unauthorized');
            }
            return response.json();
        })
        .then(data => {
            localStorage.setItem('luxeUser', data.name);
            window.location.href = "index.html";
        })
        .catch(err => {
            errorDiv.style.display = 'block';
            errorDiv.style.animation = 'none';
            errorDiv.offsetHeight;
            errorDiv.style.animation = 'shakeX 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94)';

            loginBtn.disabled = false;
            loginBtn.querySelector('span').innerText = "Sign In";
            document.getElementById('password').value = "";
        });
    });
</script>

</body>
</html>
