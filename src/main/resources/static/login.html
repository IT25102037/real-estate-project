<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>Login - LuxeEstate</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        :root {

        --primary-gradient: linear-gradient(135deg, #818cf8, #d946ef);

        --accent: #22d3ee;

        --glass-dark: rgba(15, 23, 42, 0.85);

        --glass-border: rgba(255, 255, 255, 0.1);

        --text-main: #f8fafc;

        --error-red: #ef4444;

        }



        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }



        body {

        background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.8)),

        url('https://images.pexels.com/photos/1571460/pexels-photo-1571460.jpeg?auto=compress&cs=tinysrgb&w=1600');

        background-size: cover;

        background-position: center;

        min-height: 100vh;

        display: flex;

        align-items: center;

        justify-content: center;

        }



        .form-container {

        background: var(--glass-dark);

        backdrop-filter: blur(25px);

        padding: 40px;

        border-radius: 28px;

        border: 1px solid var(--glass-border);

        width: 90%;

        max-width: 400px;

        text-align: center;

        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);

        }



        h2 { color: var(--text-main); margin-bottom: 25px; font-size: 28px; }



        input {

        width: 100%; padding: 14px 20px; margin-bottom: 15px;

        border-radius: 12px; border: 1px solid var(--glass-border);

        background: rgba(255, 255, 255, 0.05); color: white;

        outline: none; transition: 0.3s;

        }



        input:focus {

        border-color: var(--accent);

        background: rgba(255, 255, 255, 0.1);

        }

button {

        width: 100%; padding: 15px; background: var(--primary-gradient);

        color: white; border: none; border-radius: 12px;

        font-weight: 700; cursor: pointer; transition: 0.3s;

        text-transform: uppercase; letter-spacing: 1px;

        }



        button:hover { transform: translateY(-2px); opacity: 0.9; }

        button:disabled { background: #475569; cursor: not-allowed; transform: none; }



        .links { margin-top: 20px; }

        .links a { color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 600; }

        .links a:hover { text-decoration: underline; }



        #errorMessage {

        color: var(--error-red);

        font-size: 13px;

        margin-bottom: 15px;

        display: none; /* Hidden by default */

        }

    </style>

</head>

<body>


<div class="form-container">

    <h2 style="color: var(--accent); letter-spacing: -1px; font-weight: 800;">LuxeEstate</h2>

    <h2 style="font-size: 18px; margin-top: -15px; font-weight: 400; opacity: 0.8;">Welcome Back</h2>


    <div id="errorMessage">Invalid email or password. Please try again.</div>


    <form id="loginForm">

        <input id="email" placeholder="Email Address" required type="email">

        <input id="password" placeholder="Password" required type="password">

        <button id="loginBtn" type="submit">Sign In</button>

    </form>


    <div class="links">

        <a href="add-customer.html">Don't have an account? Register Now</a>

    </div>

</div>


<script>

    document.getElementById('loginForm').addEventListener('submit', function(e) {

    e.preventDefault();



    const email = document.getElementById('email').value;

    const password = document.getElementById('password').value;

    const errorDiv = document.getElementById('errorMessage');

    const loginBtn = document.getElementById('loginBtn');



    // Reset UI

    errorDiv.style.display = 'none';

    loginBtn.disabled = true;

    loginBtn.innerText = "Checking...";



    const loginData = {

    email: email,

    password: password

    };



    // Call your Spring Boot API

    fetch('http://localhost:8080/api/customers/login', {

    method: 'POST',

    headers: { 'Content-Type': 'application/json' },

    body: JSON.stringify(loginData)

    })

    .then(response => {

    // If response is not 200 OK, it means wrong credentials

    if (!response.ok) {

    throw new Error('Unauthorized');

    }

    return response.json();

    })

    .then(data => {

    // SUCCESSFUL LOGIN

    // Store the user's name so index.html can display "Hello, [Name]"

    localStorage.setItem('luxeUser', data.name);



    // Redirect to home page

    window.location.href = "index.html";

    })

    .catch(err => {

    // FAILED LOGIN

    errorDiv.style.display = 'block';

    loginBtn.disabled = false;

    loginBtn.innerText = "Sign In";

   // Optional: Clear password field for security

    document.getElementById('password').value = "";

    });

    });

</script>
</body>
</html>
