<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Messages | LuxeEstate Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #818cf8;
            --accent: #22d3ee;
            --sidebar-width: 280px;
            --glass-dark: rgba(15, 23, 42, 0.85);
            --card-glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(49, 46, 129, 0.7)),
                        url('https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center; background-attachment: fixed;
            display: flex; height: 100vh; color: var(--text-main); overflow: hidden;
        }

        aside {
            width: var(--sidebar-width);
            background: var(--glass-dark);
            backdrop-filter: blur(30px);
            border-right: 1px solid var(--glass-border);
            display: flex; flex-direction: column; padding: 35px 20px;
        }

        .admin-topic { font-size: 14px; font-weight: 800; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 40px; padding-left: 12px; }
        .nav-menu { list-style: none; flex-grow: 1; }
        .nav-item { display: flex; align-items: center; padding: 14px 18px; margin-bottom: 8px; border-radius: 14px; color: var(--text-dim); text-decoration: none; font-weight: 500; transition: 0.3s; }
        .nav-item i { margin-right: 14px; width: 20px; }
        .nav-item.active { background: rgba(129, 140, 248, 0.15); color: #c7d2fe; border: 1px solid rgba(129, 140, 248, 0.4); }

        main { flex-grow: 1; padding: 40px; overflow-y: auto; }
        header { margin-bottom: 30px; }
        header h1 { font-size: 32px; font-weight: 700; }

        .table-glass-container {
            background: var(--card-glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px;
        }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 15px; color: var(--accent); font-size: 12px; text-transform: uppercase; border-bottom: 1px solid var(--glass-border); text-align: center; /* Ensures headers are centered */}
        td { padding: 18px 15px; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 14px; vertical-align: top; }

        .type-badge {
            background: rgba(129, 140, 248, 0.2);
            color: #c7d2fe;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
        }
    </style>
</head>
<body>

<aside>
    <div class="admin-topic">LuxeEstate</div>
    <nav class="nav-menu">
        <a href="admin-dashboard.html" class="nav-item"><i data-lucide="layout-grid"></i> Dash board</a>
        <a href="view-customer.html" class="nav-item"><i data-lucide="users-2"></i> Customers</a>
        <a href="view-messages.html" class="nav-item active"><i data-lucide="mail"></i> Messages</a>
    </nav>
</aside>

<main>
    <header>
        <h1>Customer Inquiries</h1>
    </header>

    <div class="table-glass-container">
        <table>
            <thead>
            <tr>
                <th>Customer</th>
                <th>Inquiry Type</th>
                <th>Contact Info</th>
                <th>Message</th>
            </tr>
            </thead>
            <tbody id="messageTableBody">
            </tbody>
        </table>
    </div>
</main>

<script>
    lucide.createIcons();

    async function loadMessages() {
        try {
            const response = await fetch('http://localhost:8081/api/contact');
            const messages = await response.json();
            const tableBody = document.getElementById('messageTableBody');

            tableBody.innerHTML = messages.map(msg => `
                <tr>
                    <td><b>${msg.userName}</b></td>
                    <td><span class="type-badge">${msg.inquiryType}</span></td>
                    <td>${msg.userEmail}<br><small>${msg.userPhone || 'No Phone'}</small></td>
                    <td style="max-width: 400px; line-height: 1.5; color: #cbd5e1;">${msg.userMessage}</td>
                </tr>
            `).join('');
        } catch (error) {
            console.error('Error loading messages:', error);
        }
    }

    window.onload = loadMessages;
</script>
</body>
</html>
