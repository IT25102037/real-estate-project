<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Inquiries | LuxeEstate Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --gold: #c9a96e;
            --gold-light: #e8d5b0;
            --gold-dark: #8b6914;
            --obsidian: #0a0a0a;
            --white: #ffffff;
            --border-gold: rgba(201,169,110,0.3);
            --glass-bg: rgba(45, 35, 20, 0.46);
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);

            /* Status Accents */
            --status-green: rgba(34, 197, 94, 0.25);
            --status-blue: rgba(99, 102, 241, 0.25);
            --status-red: rgba(220, 38, 38, 0.25);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #0a0a0a;
            color: var(--white);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- BACKGROUND LAYERS (Matched to Register Page) --- */
        .bg-layer {
            position: fixed; inset: 0;
            background: url('https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            filter: brightness(0.45) saturate(1.1);
            z-index: -2;
        }
        .bg-overlay {
            position: fixed; inset: 0;
            background: linear-gradient(160deg, rgba(30,22,10,0.5) 0%, rgba(10,8,4,0.7) 100%);
            z-index: -1;
        }
        .bg-grain {
            position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            opacity: 0.2; z-index: -1; pointer-events: none;
        }

        /* --- SIDEBAR --- */
        aside {
            width: 280px;
            background: rgba(15, 12, 8, 0.85);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-gold);
            display: flex; flex-direction: column; padding: 40px 24px;
            z-index: 10;
        }

        .admin-topic {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px; letter-spacing: 4px; text-transform: uppercase;
            color: var(--gold); margin-bottom: 50px; text-align: center;
        }

        .nav-menu { list-style: none; flex-grow: 1; }
        .nav-item {
            display: flex; align-items: center; padding: 14px 18px; margin-bottom: 10px;
            border-radius: 2px; color: rgba(255,255,255,0.5); text-decoration: none;
            font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase;
            transition: var(--transition); border: 1px solid transparent;
        }
        .nav-item i { margin-right: 12px; width: 18px; color: var(--gold); }
        .nav-item:hover, .nav-item.active {
            color: var(--white);
            background: rgba(201,169,110,0.1);
            border-color: var(--border-gold);
        }

        .btn-logout { margin-top: auto; color: #fda4af; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; }

        /* --- MAIN CONTENT --- */
        main { flex-grow: 1; padding: 60px; overflow-y: auto; z-index: 1; }

        .header-section { margin-bottom: 40px; opacity: 0; animation: fadeUp 0.8s forwards; }
        .header-section h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 42px; font-weight: 300; letter-spacing: -1px;
        }

        /* --- FILTERS --- */
        .filter-glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-gold);
            padding: 24px; border-radius: 4px; margin-bottom: 30px;
            display: flex; align-items: center; gap: 15px;
            opacity: 0; animation: fadeUp 0.8s 0.2s forwards;
        }

        .filter-glass-panel input, .filter-glass-panel select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(201,169,110,0.2);
            padding: 12px 16px; border-radius: 2px;
            color: var(--white); outline: none; font-size: 13px;
        }

        .filter-glass-panel select option { background: #1e160a; }

        .btn-primary {
            background: var(--gold);
            color: var(--obsidian); border: none; padding: 12px 24px;
            cursor: pointer; font-weight: 700; text-transform: uppercase;
            letter-spacing: 2px; font-size: 11px; transition: var(--transition);
        }
        .btn-primary:hover { background: var(--gold-light); box-shadow: 0 0 20px rgba(201,169,110,0.3); }

        /* --- TABLE --- */
        .table-glass-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-gold);
            border-radius: 4px; padding: 10px;
            opacity: 0; animation: fadeUp 0.8s 0.4s forwards;
        }

        table { width: 100%; border-collapse: collapse; }
        th {
            padding: 20px 15px; color: var(--gold); font-size: 10px;
            text-transform: uppercase; letter-spacing: 2px; text-align: left;
            border-bottom: 1px solid var(--border-gold);
        }
        td { padding: 20px 15px; font-size: 13px; border-bottom: 1px solid rgba(201,169,110,0.1); vertical-align: middle; }

        .inquiry-badge {
            border: 1px solid var(--gold);
            color: var(--gold); padding: 4px 10px; font-size: 10px; font-weight: 700; text-transform: uppercase;
        }

        .btn-remove {
            background: transparent; color: #ff6b6b; border: 1px solid #ff6b6b;
            padding: 8px 15px; font-size: 10px; font-weight: 700; text-transform: uppercase;
            cursor: pointer; transition: var(--transition);
        }
        .btn-remove:hover { background: #ff6b6b; color: var(--white); }

        .status-select {
            background: rgba(0,0,0,0.3); color: var(--white);
            border: 1px solid rgba(201,169,110,0.3); padding: 6px; font-size: 11px;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #empty-state {
            padding: 50px; text-align: center; color: var(--gold-light);
            border: 1px dashed var(--border-gold); margin: 20px; display: none;
        }
    </style>
</head>
<body>

<div class="bg-layer"></div>
<div class="bg-overlay"></div>
<div class="bg-grain"></div>

<aside>
    <div class="admin-topic">Luxe<span>_Estate</span></div>
    <nav class="nav-menu">
        <a href="admin-dashboard.html" class="nav-item"><i data-lucide="layout-grid"></i> Dashboard</a>
        <a href="view-customer.html" class="nav-item"><i data-lucide="users"></i> Customers</a>
        <a href="view-listings.html" class="nav-item"><i data-lucide="home"></i> Listings</a>
        <a href="view-messages.html" class="nav-item active"><i data-lucide="mail"></i> Messages</a>
    </nav>
    <a href="admin-login.html" class="nav-item btn-logout">
        <i data-lucide="power"></i> Logout
    </a>
</aside>

<main>
    <div class="header-section">
        <h1>Client <em>Inquiries</em></h1>
    </div>

    <div class="filter-glass-panel">
        <input type="text" id="searchId" style="width: 80px;" placeholder="ID">
        <input type="text" id="searchGeneral" style="flex: 1;" placeholder="Search names, emails, or content...">

        <select id="statusFilter">
            <option value="">Status</option>
            <option value="New">New</option>
            <option value="Pending">Pending</option>
            <option value="Replied">Replied</option>
            <option value="Reject">Reject</option>
        </select>

        <select id="inquiryFilter">
            <option value="">All Inquiries</option>
            <option value="General">General</option>
            <option value="Property Inquiry">Property Inquiry</option>
            <option value="Support">Support</option>
            <option value="Feedback">Feedback</option>
        </select>
        <button class="btn-primary" onclick="filterMessages()"><span>Filter</span></button>
    </div>

    <div class="table-glass-container">
        <table id="messageTable">
            <thead>
            <tr>
                <th>ID</th>
                <th>Customer</th>
                <th>Type</th>
                <th>Status</th>
                <th>Contact</th>
                <th>Message</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="messageTableBody">
            </tbody>
        </table>

        <div id="empty-state">
            <i data-lucide="search-x" style="width: 48px; height: 48px; margin-bottom: 15px; opacity: 0.5;"></i>
            <h3>No Records Found</h3>
            <p>Refine your search criteria.</p>
        </div>
    </div>
</main>

<script>
    lucide.createIcons();

    function getRowColor(status) {
        if (status === 'Replied') return 'var(--status-green)';
        if (status === 'Pending') return 'var(--status-blue)';
        if (status === 'Reject') return 'var(--status-red)';
        return 'transparent';
    }

    async function loadMessages() {
        try {
            const response = await fetch('http://localhost:8080/api/contact');
            const messages = await response.json();
            const tableBody = document.getElementById('messageTableBody');

            tableBody.innerHTML = messages.map(msg => `
                <tr id="row-${msg.id}" data-status="${msg.status}" style="background-color: ${getRowColor(msg.status)}">
                    <td>#${msg.id}</td>
                    <td><b>${msg.userName}</b></td>
                    <td><span class="inquiry-badge">${msg.inquiryType}</span></td>
                    <td>
                        <select class="status-select" onchange="updateStatus(${msg.id}, this.value)">
                            <option value="New" ${msg.status === 'New' ? 'selected' : ''}>New</option>
                            <option value="Pending" ${msg.status === 'Pending' ? 'selected' : ''}>Pending</option>
                            <option value="Replied" ${msg.status === 'Replied' ? 'selected' : ''}>Replied</option>
                            <option value="Reject" ${msg.status === 'Reject' ? 'selected' : ''}>Reject</option>
                        </select>
                    </td>
                    <td>
                        <div style="line-height: 1.4;">
                            <span style="display:block; font-weight: 500;">${msg.userEmail}</span>
                            <small style="color: var(--gold-light); font-size: 11px;">${msg.userPhone || 'No Phone'}</small>
                        </div>
                    </td>
                    <td style="max-width: 300px; color: rgba(255,255,255,0.7); font-size: 12px; line-height: 1.6;">${msg.userMessage}</td>
                    <td>
                        <button class="btn-remove" onclick="removeInquiry(${msg.id})">Remove</button>
                    </td>
                </tr>
            `).join('');

            lucide.createIcons();
        } catch (error) {
            console.error('Error loading messages:', error);
        }
    }

    async function updateStatus(id, newStatus) {
        try {
            const response = await fetch(`http://localhost:8080/api/contact/${id}/status`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newStatus)
            });

            if (response.ok) {
                const row = document.getElementById(`row-${id}`);
                row.style.backgroundColor = getRowColor(newStatus);
                row.setAttribute('data-status', newStatus);
            } else {
                alert("Update failed");
            }
        } catch (error) {
            console.error('Error:', error);
        }
    }

    function filterMessages() {
        const idSearch = document.getElementById('searchId').value.toLowerCase();
        const genSearch = document.getElementById('searchGeneral').value.toLowerCase();
        const statSearch = document.getElementById('statusFilter').value.toLowerCase();
        const typeSearch = document.getElementById('inquiryFilter').value.toLowerCase();

        const rows = document.querySelectorAll('#messageTableBody tr');
        let found = false;

        rows.forEach(row => {
            const idT = row.cells[0].textContent.toLowerCase();
            const cusT = row.cells[1].textContent.toLowerCase();
            const typeT = row.cells[2].textContent.toLowerCase();
            const statT = row.getAttribute('data-status').toLowerCase();
            const conT = row.cells[4].textContent.toLowerCase();

            const match = (idSearch === "" || idT.includes(idSearch)) &&
                          (genSearch === "" || cusT.includes(genSearch) || conT.includes(genSearch)) &&
                          (statSearch === "" || statT === statSearch) &&
                          (typeSearch === "" || typeT.includes(typeSearch));

            row.style.display = match ? "" : "none";
            if(match) found = true;
        });

        document.getElementById('messageTable').style.display = found ? "table" : "none";
        document.getElementById('empty-state').style.display = found ? "none" : "block";
    }

    async function removeInquiry(id) {
        if(confirm("Permanently delete this inquiry?")) {
            try {
                const response = await fetch(`http://localhost:8080/api/contact/${id}`, { method: 'DELETE' });
                if(response.ok) loadMessages();
            } catch (error) { console.error('Error:', error); }
        }
    }

    window.onload = loadMessages;
</script>
</body>
</html>
