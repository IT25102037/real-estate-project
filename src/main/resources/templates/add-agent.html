<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Agent</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e1410, #4a3426, #7a5a45);
            font-family: 'Segoe UI', sans-serif;
            color: #f5f5f5;
        }

        .form-card {
            background: rgba(255,255,255,0.18);
            border-radius: 22px;
            padding: 30px;
            backdrop-filter: blur(8px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.35);
        }

        input, select {
            background: rgba(255,255,255,0.25) !important;
            border: none !important;
            color: black !important;
            border-radius: 10px !important;
        }

        input::placeholder {
            color: #333;
        }

        .btn-main {
            background: linear-gradient(135deg, #b08968, #6f4e37);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 10px 20px;
            font-weight: 600;
        }

        .btn-back {
            background: rgba(255,255,255,0.3);
            color: black;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <div class="form-card mx-auto" style="max-width:700px;">

        <h2 class="text-center mb-4">Add New Agent</h2>

        <form th:action="@{/agents/save}" th:object="${agent}" method="post" enctype="multipart/form-data">

            <input type="text" th:field="*{name}" class="form-control mb-3" placeholder="Agent Name" required>

            <input type="email" th:field="*{email}" class="form-control mb-3" placeholder="Email" required>

            <input type="text" th:field="*{phone}" class="form-control mb-3" placeholder="Phone" required>

            <input type="text" th:field="*{address}" class="form-control mb-3" placeholder="Address" required>

            <input type="text" th:field="*{assignedArea}" class="form-control mb-3" placeholder="Assigned Area" required>

            <input type="number" step="0.01" th:field="*{commissionRate}" class="form-control mb-3" placeholder="Commission Rate" required>

            <select th:field="*{status}" class="form-control mb-3">
                <option value="">Select Status</option>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
            </select>

            <input type="text" th:field="*{specialization}" class="form-control mb-3" placeholder="Specialization">

            <input type="number" th:field="*{experience}" class="form-control mb-3" placeholder="Experience (Years)">

            <input type="file" name="imageFile" class="form-control mb-3">

            <div class="d-flex justify-content-between">
                <a href="/agents" class="btn btn-back">Back</a>
                <button type="submit" class="btn btn-main">Save Agent</button>
            </div>

        </form>

    </div>

</div>

</body>
</html>
