<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoices</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon"></div>
            <div class="brand">
                <h2>RealEstate</h2>
                <span>Finance Suite</span>
            </div>
        </div>

        <div class="nav-links">
            <a href="/dashboard" class="nav-link">
                <div class="dot"></div>
                <span>Dashboard</span>
            </a>
            <a href="/payment-page" class="nav-link">
                <div class="dot"></div>
                <span>New Payment</span>
            </a>
            <a href="/invoice-page" class="nav-link active">
                <div class="dot"></div>
                <span>Invoices</span>
            </a>
            <a href="/payment-history-page" class="nav-link">
                <div class="dot"></div>
                <span>Payment History</span>
            </a>
            <a href="/bank-account-page" class="nav-link">
                <div class="dot"></div>
                <span>Bank Accounts</span>
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header-section">
            <div class="header-text">
                <h1>Invoices</h1>
                <p>Manage and track all generated invoices.</p>
            </div>
            <div class="header-actions">
                <button type="button" class="btn btn-secondary" onclick="loadInvoices()">Load Invoices</button>
            </div>
        </div>

        <div class="table-section">
            <div id="invoiceList">
                <p class="text-center text-secondary">Click "Load Invoices" to fetch data.</p>
            </div>
        </div>
    </div>

    <script src="/js/invoice.js"></script>
</body>
</html>
