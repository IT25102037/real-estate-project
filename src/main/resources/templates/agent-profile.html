<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Agent Profile</title>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1e1410, #4a3426, #7a5a45);
            color: white;
        }

        .profile-card {
            background: rgba(255,255,255,0.18);
            border-radius: 20px;
            padding: 30px;
        }

        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
        }

        .info-box {
            background: rgba(255,255,255,0.2);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .btn-main {
            background: linear-gradient(135deg,#b08968,#6f4e37);
            color: white;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <div class="profile-card mx-auto text-center" style="max-width:600px;">

        <img th:if="${agent.profileImageName != null}"
             th:src="@{'/agent-images/' + ${agent.profileImageName}}"
             class="profile-img mb-3">

        <img th:if="${agent.profileImageName == null}"
             src="/uploads/default.png"
             class="profile-img mb-3">

        <h2 th:text="${agent.name}"></h2>

        <div class="info-box">
            <strong>Agent Code:</strong>
            <span th:text="${agent.agentCode}"></span>
        </div>

        <div class="info-box">
            <strong>Email:</strong>
            <span th:text="${agent.email}"></span>
        </div>

        <div class="info-box">
            <strong>Phone:</strong>
            <span th:text="${agent.phone}"></span>
        </div>

        <div class="info-box">
            <strong>Area:</strong>
            <span th:text="${agent.assignedArea}"></span>
        </div>

        <div class="info-box">
            <strong>Status:</strong>
            <span th:text="${agent.status}"></span>
        </div>

        <a th:href="${backUrl}" class="btn btn-secondary mt-3">Back</a>

    </div>

</div>

</body>
</html>
