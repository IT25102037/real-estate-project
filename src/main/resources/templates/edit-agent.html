<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Agent</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e1410, #4a3426, #7a5a45);
            font-family: 'Segoe UI', sans-serif;
            color: #f5f5f5;
        }

        .form-card {
            background: rgba(255,255,255,0.18);
            border-radius: 22px;
            padding: 30px;
            backdrop-filter: blur(8px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.35);
        }

        input, select {
            background: rgba(255,255,255,0.25) !important;
            border: none !important;
            color: black !important;
            border-radius: 10px !important;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #d6a77a;
        }

        .btn-main {
            background: linear-gradient(135deg, #b08968, #6f4e37);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 10px 20px;
            font-weight: 600;
        }

        .btn-back {
            background: rgba(255,255,255,0.3);
            color: black;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <div class="form-card mx-auto" style="max-width:700px;">

        <h2 class="text-center mb-4">Edit Agent</h2>

        <!-- Profile Image Preview -->
        <div class="text-center mb-3">
            <img th:if="${agent.profileImageName != null and agent.profileImageName != ''}"
                 th:src="@{'/agent-images/' + ${agent.profileImageName}}"
                 class="profile-img">

            <img th:if="${agent.profileImageName == null or agent.profileImageName == ''}"
                 src="/uploads/default.png"
                 class="profile-img">
        </div>

        <form th:action="@{/agents/update/{id}(id=${agent.agentId})}"
              th:object="${agent}"
              method="post"
              enctype="multipart/form-data">

            <input type="text" th:field="*{name}" class="form-control mb-3" required>
            <input type="email" th:field="*{email}" class="form-control mb-3" required>
            <input type="text" th:field="*{phone}" class="form-control mb-3" required>
            <input type="text" th:field="*{address}" class="form-control mb-3" required>
            <input type="text" th:field="*{assignedArea}" class="form-control mb-3" required>
            <input type="number" step="0.01" th:field="*{commissionRate}" class="form-control mb-3" required>

            <select th:field="*{status}" class="form-control mb-3">
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
            </select>

            <input type="text" th:field="*{specialization}" class="form-control mb-3">
            <input type="number" th:field="*{experience}" class="form-control mb-3">

            <input type="file" name="imageFile" class="form-control mb-3">

            <div class="d-flex justify-content-between">
                <a href="/agents" class="btn btn-back">Back</a>
                <button type="submit" class="btn btn-main">Update Agent</button>
            </div>

        </form>

    </div>

</div>

</body>
</html>
