<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Our Agents</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
           min-height: 100vh;

           background-image:
             linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
             url('/uploads/customer-bg.jpeg');

           background-size: cover;
           background-position: center;
           background-repeat: no-repeat;
           background-attachment: fixed;

           color: #f5f5f5;
           font-family: 'Segoe UI', sans-serif;
         }

         .top-bar {
             background: rgba(20, 12, 8, 0.9);
             padding: 20px 40px;
             border-bottom: 1px solid rgba(255,255,255,0.15);
         }

         .brand {
             font-size: 28px;
             font-weight: 800;
             color: #f1d2b6;
         }

         .agent-card {
             background: rgba(255,255,255,0.18);
             border-radius: 20px;
             padding: 25px;
             text-align: center;
             backdrop-filter: blur(8px);
             box-shadow: 0 12px 25px rgba(0,0,0,0.3);
             transition: 0.3s;
             height: 100%;
         }

         .agent-card:hover {
             transform: translateY(-8px);
             box-shadow: 0 18px 35px rgba(0,0,0,0.5);
         }

         .agent-img {
             width: 110px;
             height: 110px;
             border-radius: 50%;
             object-fit: cover;
             border: 3px solid #d6a77a;
         }

         .btn-main {
             background: linear-gradient(135deg, #b08968, #6f4e37);
             color: white;
             border: none;
             border-radius: 12px;
             padding: 10px 18px;
             font-weight: 600;
         }
    </style>
</head>

<body>

<!-- Top Bar -->
<div class="top-bar d-flex justify-content-between align-items-center">
    <div class="brand">🏛 Luxe Estate</div>
    <a href="/" class="btn btn-outline-light">Home</a>
</div>

<!-- Content -->
<div class="container mt-5">

    <div class="mb-5">
        <h2 class="fw-bold">Meet Our Agents</h2>
        <p style="color:#f1d2b6;">Connect with professional agents to find your perfect property</p>
    </div>

    <div class="row">
        <div class="col-md-4 mb-4" th:each="agent : ${agentList}">

            <div class="agent-card">

                <!-- Image -->
                <img th:if="${agent.profileImageName != null and agent.profileImageName != ''}"
                     th:src="@{'/agent-images/' + ${agent.profileImageName}}"
                     class="agent-img mb-3">

                <img th:if="${agent.profileImageName == null or agent.profileImageName == ''}"
                     src="/uploads/default.png"
                     class="agent-img mb-3">

                <!-- Info -->
                <h4 th:text="${agent.name}"></h4>
                <p style="color:#f1d2b6;" th:text="${agent.specialization}"></p>

                <p><strong>Area:</strong> <span th:text="${agent.assignedArea}"></span></p>
                <p><strong>Experience:</strong> <span th:text="${agent.experience}"></span> years</p>

                <!-- Button -->
                <a th:href="@{/agents/profile/{id}(id=${agent.agentId}, from='customer')}"
                   class="btn btn-main mt-2">
                    View Profile
                </a>

            </div>

        </div>
    </div>

</div>

</body>
</html>
