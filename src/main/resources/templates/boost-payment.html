<!DOCTYPE html>
<html>
<head>
    <title>Boost Payments</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="container">

    <button type="button" onclick="window.location.href='/dashboard'">
        Back to Dashboard
    </button>

    <h1>Boost Payments</h1>

    <form id="boostForm">

        <input type="number" id="userId" placeholder="User ID" required>

        <input type="number" id="propertyId" placeholder="Property ID" required>

        <input type="number" id="paymentId" placeholder="Payment ID" required>

        <input type="text" id="boostPackage" placeholder="Boost Package" required>

        <input type="number" id="boostDays" placeholder="Boost Days" required>

        <button type="submit">Create Boost Payment</button>

    </form>

    <h3 id="message"></h3>

    <button type="button" onclick="loadBoostPayments()">
        Load Boost Payments
    </button>

    <div id="boostList"></div>

</div>

<script src="/js/boost-payment.js"></script>
</body>
</html>
