<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Agent Management</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e1410, #4a3426, #7a5a45);
            color: #f5f5f5;
            font-family: 'Segoe UI', sans-serif;
        }

        .top-bar {
            background: rgba(20, 12, 8, 0.92);
            padding: 22px 45px;
            border-bottom: 1px solid rgba(255,255,255,0.12);
        }

        .brand {
            font-size: 30px;
            font-weight: 800;
            color: #f1d2b6;
        }

        .btn-add {
            background: linear-gradient(135deg, #c89b6d, #8b5e3c);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 10px 20px;
            font-weight: 600;
            text-decoration: none;
        }

        .btn-add:hover {
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.35);
        }

        .glass-card {
            background: rgba(255,255,255,0.16);
            border-radius: 22px;
            padding: 28px;
            backdrop-filter: blur(8px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.35);
        }

        .table {
            color: white;
            border-collapse: separate;
            border-spacing: 0 10px;
            margin-bottom: 0;
        }

        .table thead th {
            background: rgba(35, 20, 12, 0.92);
            color: #f1d2b6;
            border: none;
            padding: 14px;
            font-weight: 700;
        }

        .table tbody td {
            background: rgba(255,255,255,0.18);
            color: #111;
            border: none;
            padding: 13px 14px;
            vertical-align: middle;
        }

        .table tbody tr:hover td {
            background: rgba(255,255,255,0.25);
        }

        .agent-img {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #d6a77a;
        }

        .status-badge {
            background: rgba(176,137,104,0.45);
            color: #1e1410;
            padding: 7px 14px;
            border-radius: 14px;
            font-weight: 600;
        }

        .btn-action {
            padding: 7px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            margin-right: 6px;
            transition: 0.3s;
            border: none;
            display: inline-block;
        }

        .btn-profile {
            background: linear-gradient(135deg, #c89b6d, #8b5e3c);
            color: white;
        }

        .btn-edit {
            background: linear-gradient(135deg, #e0b27c, #a67c52);
            color: #1e1410;
        }

        .btn-delete {
            background: linear-gradient(135deg, #b85c38, #7a2e1c);
            color: white;
        }

        .btn-action:hover {
            transform: scale(1.05);
            color: white;
            box-shadow: 0 6px 16px rgba(0,0,0,0.35);
        }
        .filter-box {
           background: rgba(255,255,255,0.16);
           border-radius: 18px;
           padding: 18px;
           margin-bottom: 22px;
           backdrop-filter: blur(8px);
        }

        .search-input {
           background: rgba(255,255,255,0.25) !important;
           border: none !important;
           color: #111 !important;
           border-radius: 12px !important;
           padding: 10px 14px;
        }

        .btn-filter {
           background: linear-gradient(135deg, #c89b6d, #8b5e3c);
           color: white;
           border: none;
           border-radius: 12px;
           padding: 10px 18px;
           font-weight: 600;
        }

        .btn-reset {
           background: rgba(255,255,255,0.25);
           color: #111;
           border: none;
           border-radius: 12px;
           padding: 10px 18px;
           font-weight: 600;
        }
    </style>
</head>

<body>

<div class="top-bar d-flex justify-content-between align-items-center">
    <div class="brand">🏛 Luxe Estate</div>
    <a href="/agents/new" class="btn-add">+ Add Agent</a>
</div>

<div class="container mt-5">
    <form th:action="@{/agents}" method="get" class="filter-box">
        <div class="row g-3 align-items-center">

            <div class="col-md-5">
                <input type="text"
                       name="keyword"
                       class="form-control search-input"
                       placeholder="Search by agent name or code..."
                       th:value="${keyword}">
            </div>

            <div class="col-md-3">
                <select name="status" class="form-select search-input">
                    <option value="">All Status</option>
                    <option value="Active" th:selected="${status == 'Active'}">Active</option>
                    <option value="Inactive" th:selected="${status == 'Inactive'}">Inactive</option>
                </select>
            </div>

            <div class="col-md-4 d-flex gap-2">
                <button type="submit" class="btn btn-filter">Search</button>
                <a href="/agents" class="btn btn-reset">Reset</a>
            </div>

        </div>
    </form>
    <div class="glass-card">
        <table class="table align-middle">
            <thead>
            <tr>
                <th>Photo</th>
                <th>Code</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Area</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="agent : ${agentList}">
                <td>
                    <img th:if="${agent.profileImageName != null and agent.profileImageName != ''}"
                         th:src="@{'/agent-images/' + ${agent.profileImageName}}"
                         class="agent-img">

                    <img th:if="${agent.profileImageName == null or agent.profileImageName == ''}"
                         src="/uploads/default.png"
                         class="agent-img">
                </td>

                <td th:text="${agent.agentCode}"></td>
                <td th:text="${agent.name}"></td>
                <td th:text="${agent.email}"></td>
                <td th:text="${agent.phone}"></td>
                <td th:text="${agent.assignedArea}"></td>

                <td>
                    <span class="status-badge" th:text="${agent.status}"></span>
                </td>

                <td>
                    <a th:href="@{/agents/profile/{id}(id=${agent.agentId}, from='admin')}"
                       class="btn-action btn-profile">Profile</a>

                    <a th:href="@{/agents/edit/{id}(id=${agent.agentId})}"
                       class="btn-action btn-edit">Edit</a>

                    <a th:href="@{/agents/delete/{id}(id=${agent.agentId})}"
                       class="btn-action btn-delete"
                       onclick="return confirm('Delete this agent?')">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
